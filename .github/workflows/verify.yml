name: Verify research artifacts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and guard tests
        run: python -m unittest discover -s tests -v
      - name: Verify supplied evidence and release hashes
        run: python scripts/verify_release.py
      - name: Regenerate result summary
        run: python scripts/summarize_results.py
